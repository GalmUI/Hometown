plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'dev.conner.hometown'
version = mod_version
base { archivesName = 'hometown' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
repositories { mavenCentral() }
neoForge {
    version = '21.1.250'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { hometown { sourceSet sourceSets.main } }
    unitTest {
        enable()
        // Include test classes/resources in Hometown's module for NeoForge's test loader.
        testedMod = mods.hometown
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('processResources') {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
