name: R2 M6 One Shot Profile Patch

on:
  push:
    branches: [r2-m6]
    paths: [.github/workflows/r2-m6-one-shot-profile.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-m6
          fetch-depth: 1
      - name: Apply diagnostic-only M6 profile patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old,new))

          service='src/main/java/dev/conner/hometown/settlement/TownLedgerService.java'
          replace(service,
          '''            CommerceSnapshot commerce,ProsperitySnapshot prosperity,List<HistoryEvent> history) {
                  Observation { history=List.copyOf(history); }
                  TownLedgerSnapshot page(int page) {
                      return TownLedgerSnapshot.of(key.town(),stats,bell,page).withHousing(housing).withFood(food).withSafety(safety).withComfort(comfort);
                  }
                  Observation withHistory(List<HistoryEvent> events){return new Observation(key,stats,bell,housing,food,variety,growing,safety,comfort,commerce,prosperity,events);}
              }''',
          '''            CommerceSnapshot commerce,ProsperitySnapshot prosperity,List<HistoryEvent> history,long elapsedNanos) {
                  Observation { history=List.copyOf(history);if(elapsedNanos<0)throw new IllegalArgumentException("Negative observation time"); }
                  TownLedgerSnapshot page(int page) {
                      return TownLedgerSnapshot.of(key.town(),stats,bell,page).withHousing(housing).withFood(food).withSafety(safety).withComfort(comfort);
                  }
                  Observation withHistory(List<HistoryEvent> events){return new Observation(key,stats,bell,housing,food,variety,growing,safety,comfort,commerce,prosperity,events,elapsedNanos);}
                  Observation withElapsed(long nanos){return new Observation(key,stats,bell,housing,food,variety,growing,safety,comfort,commerce,prosperity,history,nanos);}
                  LedgerPerformanceProfile performance(){
                      var town=key.town();var fd=food.diagnostics();
                      return new LedgerPerformanceProfile(town.id(),town.name(),town.dimension().location().toString(),town.bellPosition(),town.radius(),
                              safety.metadata().requestGeneration(),safety.metadata().observedGameTime(),elapsedNanos,stats.population(),housing.enclosedBeds(),
                              food.foodContainers(),fd.storageScanned(),comfort.roomsAttempted(),comfort.assessedRooms(),safety.loadedChunks(),safety.requiredChunks(),
                              safety.entitiesInspected(),safety.entityLimit(),growing.sharedBlockInspections(),growing.sharedBlockLimit(),
                              growing.candidateSections(),growing.paletteInspections(),growing.blockInspections());
                  }
              }''')

          replace(service,
          '''        if(observation==null){
                      if(state.sameTick.size()>=MAX_CACHED_TOWNS)return error(request,TownLedgerSnapshotPayload.Error.WAIT);
                      var metadata=metadata(key,++state.generation,now);
                      observation=collect(level,key,metadata);
                      state.historyTracker.advance(saved,town,metadata,observation.stats(),observation.housing(),observation.food(),observation.prosperity(),
                              key.historyFingerprints(),key.historySettings());
                      observation=observation.withHistory(saved.history(town.id()).newestFirst());
                      state.sameTick.put(key,observation);
                  }''',
          '''        if(observation==null){
                      if(state.sameTick.size()>=MAX_CACHED_TOWNS)return error(request,TownLedgerSnapshotPayload.Error.WAIT);
                      var metadata=metadata(key,++state.generation,now);long startedNanos=System.nanoTime();
                      observation=collect(level,key,metadata);
                      state.historyTracker.advance(saved,town,metadata,observation.stats(),observation.housing(),observation.food(),observation.prosperity(),
                              key.historyFingerprints(),key.historySettings());
                      observation=observation.withHistory(saved.history(town.id()).newestFirst());
                      observation=observation.withElapsed(Math.max(0L,System.nanoTime()-startedNanos));
                      state.sameTick.put(key,observation);
                  }''')

          replace(service,
          '''    /** Immutable newest-first History captured by the originating Ledger generation. */
              public static Optional<List<HistoryEvent>> history(ServerPlayer player,UUID settlementId,long generation){
                  return cached(player,settlementId,generation).map(Observation::history);
              }
              private static Optional<Observation> cached(ServerPlayer player,UUID settlementId,long generation){''',
          '''    /** Immutable newest-first History captured by the originating Ledger generation. */
              public static Optional<List<HistoryEvent>> history(ServerPlayer player,UUID settlementId,long generation){
                  return cached(player,settlementId,generation).map(Observation::history);
              }
              /** Last normal Ledger observation for this player's town session. Read-only and never scans. */
              public static Optional<LedgerPerformanceProfile> lastPerformanceProfile(ServerPlayer player,UUID settlementId){
                  var state=STATES.get(player.getServer());if(state==null)return Optional.empty();
                  var sessions=state.players.get(player.getUUID());if(sessions==null)return Optional.empty();
                  var session=sessions.get(settlementId);if(session==null)return Optional.empty();
                  long now=player.getServer().overworld().getGameTime();
                  if(now<session.lastAccess()||now-session.lastAccess()>SESSION_EXPIRY)return Optional.empty();
                  return Optional.of(session.observation().performance());
              }
              private static Optional<Observation> cached(ServerPlayer player,UUID settlementId,long generation){''')

          replace(service,
          '''        return new Observation(key,stats,bell,housing.snapshot(),food.reserves(),variety,growing,safety,comfort,commerce,prosperity,List.of());''',
          '''        return new Observation(key,stats,bell,housing.snapshot(),food.reserves(),variety,growing,safety,comfort,commerce,prosperity,List.of(),0L);''')

          hometown='src/main/java/dev/conner/hometown/Hometown.java'
          replace(hometown,
          '''import dev.conner.hometown.command.M5DebugCommands;''',
          '''import dev.conner.hometown.command.M5DebugCommands;
          import dev.conner.hometown.command.M6DebugCommands;''')
          replace(hometown,
          '''        NeoForge.EVENT_BUS.addListener(M5DebugCommands::register);''',
          '''        NeoForge.EVENT_BUS.addListener(M5DebugCommands::register);
                  NeoForge.EVENT_BUS.addListener(M6DebugCommands::register);''')

          ledger_test='src/test/java/dev/conner/hometown/settlement/LedgerObservationTest.java'
          replace(ledger_test,
          '''            var first=open(alice,component).snapshot();
                      assertEquals(reserves,first.food(),"M3 one-pass observation must preserve the protected Reserves snapshot");''',
          '''            var first=open(alice,component).snapshot();
                      var firstProfile=TownLedgerService.lastPerformanceProfile(alice,town.id()).orElseThrow();
                      assertEquals(first.metadata().requestGeneration(),firstProfile.generation());
                      assertEquals(first.metadata().observedGameTime(),firstProfile.observedGameTime());
                      assertEquals(5,firstProfile.population());assertTrue(firstProfile.elapsedNanos()>=0);
                      assertEquals(reserves,first.food(),"M3 one-pass observation must preserve the protected Reserves snapshot");''')
          replace(ledger_test,
          '''            TownLedgerService.respond(alice,new RequestTownLedgerPayload(InteractionHand.MAIN_HAND,-1,4,fresh.metadata().requestGeneration()),Items.WRITTEN_BOOK,component);
                      assertEquals(TownLedgerSnapshotPayload.Error.WAIT,TownLedgerService.respond(alice,''',
          '''            TownLedgerService.respond(alice,new RequestTownLedgerPayload(InteractionHand.MAIN_HAND,-1,4,fresh.metadata().requestGeneration()),Items.WRITTEN_BOOK,component);
                      assertTrue(TownLedgerService.lastPerformanceProfile(alice,town.id()).isPresent(),"closing the screen must not erase the cached profile");
                      assertEquals(TownLedgerSnapshotPayload.Error.WAIT,TownLedgerService.respond(alice,''')
          replace(ledger_test,
          '''            TownLedgerService.release(alice);
                      assertEquals(TownLedgerSnapshotPayload.Error.WAIT,TownLedgerService.respond(alice,''',
          '''            TownLedgerService.release(alice);
                      assertTrue(TownLedgerService.lastPerformanceProfile(alice,town.id()).isEmpty());
                      assertEquals(TownLedgerSnapshotPayload.Error.WAIT,TownLedgerService.respond(alice,''')

          Path('src/main/java/dev/conner/hometown/settlement/LedgerPerformanceProfile.java').write_text('''package dev.conner.hometown.settlement;

          import java.util.Objects;
          import java.util.UUID;
          import net.minecraft.core.BlockPos;

          /** Diagnostic-only timing/work counters captured from one normal fresh Ledger observation. Never persisted. */
          public record LedgerPerformanceProfile(UUID settlementId,String townName,String dimension,BlockPos bellPosition,int radius,
                  long generation,long observedGameTime,long elapsedNanos,int population,int enclosedBeds,
                  int foodContainers,int foodStorageScanned,int roomsAttempted,int assessedRooms,int loadedChunks,int requiredChunks,
                  int entitiesInspected,int entityLimit,int sharedBlockInspections,int sharedBlockLimit,
                  int growingCandidateSections,int growingPaletteInspections,int growingBlockInspections) {
              public LedgerPerformanceProfile {
                  Objects.requireNonNull(settlementId);Objects.requireNonNull(townName);Objects.requireNonNull(dimension);Objects.requireNonNull(bellPosition);
                  bellPosition=bellPosition.immutable();
                  if(radius<0||generation<0||observedGameTime<0||elapsedNanos<0||population<0||enclosedBeds<0||foodContainers<0||foodStorageScanned<0
                          ||roomsAttempted<0||assessedRooms<0||loadedChunks<0||requiredChunks<0||entitiesInspected<0||entityLimit<0
                          ||sharedBlockInspections<0||sharedBlockLimit<0||growingCandidateSections<0||growingPaletteInspections<0||growingBlockInspections<0
                          ||entitiesInspected>entityLimit||sharedBlockInspections>sharedBlockLimit||loadedChunks>requiredChunks)
                      throw new IllegalArgumentException("Invalid Ledger performance profile");
              }
              public double elapsedMillis(){return elapsedNanos/1_000_000.0d;}
          }
          ''')

          Path('src/main/java/dev/conner/hometown/command/M6DebugCommands.java').write_text('''package dev.conner.hometown.command;

          import com.mojang.brigadier.context.CommandContext;
          import com.mojang.brigadier.exceptions.CommandSyntaxException;
          import com.mojang.brigadier.exceptions.SimpleCommandExceptionType;
          import dev.conner.hometown.settlement.*;
          import java.util.Locale;
          import net.minecraft.commands.CommandSourceStack;
          import net.minecraft.commands.Commands;
          import net.minecraft.commands.arguments.UuidArgument;
          import net.minecraft.network.chat.Component;
          import net.neoforged.neoforge.event.RegisterCommandsEvent;

          /** M6 integration diagnostics. Performance output reads a cached normal Ledger observation and never scans. */
          public final class M6DebugCommands {
              private static final SimpleCommandExceptionType UNKNOWN=new SimpleCommandExceptionType(Component.literal("Stand inside a Hometown, or provide its UUID."));
              private static final SimpleCommandExceptionType NO_PROFILE=new SimpleCommandExceptionType(Component.literal("No recent normal Ledger observation is cached. Open this town's Ledger, close it, then run the command within 60 seconds."));
              private M6DebugCommands() {}

              public static void register(RegisterCommandsEvent event){
                  event.getDispatcher().register(Commands.literal("hometown").requires(source->source.hasPermission(2))
                          .then(Commands.literal("debug")
                                  .then(Commands.literal("performance").executes(M6DebugCommands::performance)
                                          .then(Commands.argument("uuid",UuidArgument.uuid()).executes(M6DebugCommands::performance)))));
              }

              private static int performance(CommandContext<CommandSourceStack> context) throws CommandSyntaxException {
                  var player=context.getSource().getPlayerOrException();var town=currentTown(context);
                  var profile=TownLedgerService.lastPerformanceProfile(player,town.id()).orElseThrow(NO_PROFILE::create);
                  long now=context.getSource().getServer().overworld().getGameTime();
                  context.getSource().sendSuccess(()->Component.literal(format(profile,now)),false);return 1;
              }

              static String format(LedgerPerformanceProfile p,long now){
                  long age=now>=p.observedGameTime()?now-p.observedGameTime():0;
                  var b=p.bellPosition();
                  return "Hometown Ledger performance (cached normal observation; this command ran no scan)\n"
                          +"Town: "+p.townName()+" ["+p.settlementId()+"]\n"
                          +"Dimension/Bell/Radius: "+p.dimension()+" "+b.getX()+","+b.getY()+","+b.getZ()+" r="+p.radius()+"\n"
                          +"Generation: "+p.generation()+" | observedGameTime="+p.observedGameTime()+" | ageTicks="+age+"\n"
                          +"Fresh observation elapsed: "+String.format(Locale.ROOT,"%.3f",p.elapsedMillis())+" ms\n"
                          +"Population/Beds: "+p.population()+" / "+p.enclosedBeds()+"\n"
                          +"Loaded town chunks: "+p.loadedChunks()+" / "+p.requiredChunks()+"\n"
                          +"Food containers/scanned storage: "+p.foodContainers()+" / "+p.foodStorageScanned()+"\n"
                          +"Comfort rooms: assessed="+p.assessedRooms()+" attempted="+p.roomsAttempted()+"\n"
                          +"Entity work: "+p.entitiesInspected()+" / "+p.entityLimit()+"\n"
                          +"Shared new-block work: "+p.sharedBlockInspections()+" / "+p.sharedBlockLimit()+"\n"
                          +"Growing work: sections="+p.growingCandidateSections()+" palette="+p.growingPaletteInspections()+" positions="+p.growingBlockInspections();
              }

              private static Settlement currentTown(CommandContext<CommandSourceStack> context) throws CommandSyntaxException {
                  var data=HometownSavedData.get(context.getSource().getServer());
                  if(context.getNodes().stream().anyMatch(node->node.getNode().getName().equals("uuid")))
                      return data.getSettlement(UuidArgument.getUuid(context,"uuid")).orElseThrow(UNKNOWN::create);
                  int vertical=SettlementValidator.Rules.current().verticalRadius();var player=context.getSource().getPlayerOrException();
                  return data.all().stream().filter(t->t.dimension().equals(player.level().dimension())
                                  &&SettlementQueries.bounds(t.bellPosition(),t.radius(),vertical).contains(player.position()))
                          .min(java.util.Comparator.comparingDouble(t->t.bellPosition().distSqr(player.blockPosition()))).orElseThrow(UNKNOWN::create);
              }
          }
          ''')

          Path('src/test/java/dev/conner/hometown/command/M6DebugCommandsTest.java').write_text('''package dev.conner.hometown.command;

          import dev.conner.hometown.settlement.LedgerPerformanceProfile;
          import java.util.UUID;
          import net.minecraft.core.BlockPos;
          import org.junit.jupiter.api.Test;
          import static org.junit.jupiter.api.Assertions.*;

          class M6DebugCommandsTest {
              @Test void cachedProfileFormatIsBoundedReadableAndUsesMilliseconds(){
                  var p=new LedgerPerformanceProfile(UUID.fromString("00000000-0000-0000-0000-000000000006"),"Profileton","minecraft:overworld",
                          new BlockPos(-12,70,34),64,9,1000,12_345_678,10,12,3,3,5,5,17,21,40,4096,900,262144,2,16,512);
                  String out=M6DebugCommands.format(p,1040);
                  assertTrue(out.contains("12.346 ms"));assertTrue(out.contains("ageTicks=40"));
                  assertTrue(out.contains("Loaded town chunks: 17 / 21"));assertTrue(out.contains("Shared new-block work: 900 / 262144"));
                  assertTrue(out.contains("this command ran no scan"));
              }
          }
          ''')

          Path('.github/workflows/r2-m6-one-shot-profile.yml').unlink()
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "GalmUI"
          git config user.email "ciphergalm0118@gmail.com"
          git add -A
          git commit -m "Add cached M6 Ledger performance diagnostics"
          git push origin HEAD:r2-m6
