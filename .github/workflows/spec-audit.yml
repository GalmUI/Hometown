name: R2 Comfort Spec Audit

on:
  push:
    branches:
      - r2-m2-comfort-spec-audit
    paths:
      - .github/workflows/spec-audit.yml

permissions:
  contents: read

jobs:
  extract-r2-comfort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant R2 specification text
        shell: python
        run: |
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('docs/specs/Hometown_Implementation_Specification_Revision_2.docx')
          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(path) as zf:
              root = ET.fromstring(zf.read('word/document.xml'))

          blocks = []
          body = root.find('w:body', ns)
          for node in body:
              if node.tag.endswith('}p'):
                  text = ''.join(t.text or '' for t in node.iterfind('.//w:t', ns)).strip()
                  if text:
                      blocks.append(text)
              elif node.tag.endswith('}tbl'):
                  for row in node.findall('.//w:tr', ns):
                      cells = []
                      for cell in row.findall('./w:tc', ns):
                          parts = []
                          for p in cell.findall('.//w:p', ns):
                              text = ''.join(t.text or '' for t in p.iterfind('.//w:t', ns)).strip()
                              if text:
                                  parts.append(text)
                          cells.append(' | '.join(parts))
                      row_text = ' || '.join(cells).strip()
                      if row_text:
                          blocks.append(row_text)

          patterns = [
              r'\bM2\b', r'\bComfort\b', r'\bC0[1-9]\b', r'\bC10\b',
              r'geometry', r'interior', r'boundary', r'category', r'predicate',
              r'reload', r'weight', r'room', r'excluded', r'budget', r'Ledger'
          ]
          matcher = re.compile('|'.join(patterns), re.IGNORECASE)
          selected = set()
          for i, block in enumerate(blocks):
              if matcher.search(block):
                  for j in range(max(0, i - 3), min(len(blocks), i + 4)):
                      selected.add(j)

          print('=== R2 COMFORT SPEC AUDIT EXTRACT ===')
          for i in sorted(selected):
              print(f'{i:04d}: {blocks[i]}')
          print('=== END EXTRACT ===')
