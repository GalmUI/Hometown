name: R2 M6 Dedicated Server Smoke

on:
  push:
    branches: [r2-m6-server-smoke]

permissions:
  contents: read

jobs:
  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Start server, reload resources over RCON, and stop cleanly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          enable-rcon=true
          rcon.password=hometown-m6-smoke
          rcon.port=25575
          server-port=25565
          motd=Hometown M6 smoke
          EOF
          rm -f /tmp/hometown-server.log
          ./gradlew runServer --no-daemon </dev/null > /tmp/hometown-server.log 2>&1 &
          gradle_pid=$!

          ready=0
          for i in $(seq 1 240); do
            if grep -Eq 'Done \([^)]*\)! For help' /tmp/hometown-server.log 2>/dev/null || grep -Eq 'Done \([^)]*\)! For help' run/logs/latest.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hometown-server.log || true
            cat run/logs/latest.log 2>/dev/null || true
            echo 'Dedicated server never reached ready state.' >&2
            kill -TERM "$gradle_pid" 2>/dev/null || true
            exit 1
          fi

          rcon() {
            python - "$1" <<'PY'
          import socket, struct, sys
          command=sys.argv[1]
          def packet(req, typ, text):
              body=struct.pack('<ii',req,typ)+text.encode()+b'\x00\x00'
              return struct.pack('<i',len(body))+body
          def recv_packet(sock):
              raw=sock.recv(4)
              if len(raw)!=4: raise RuntimeError('short RCON length')
              length=struct.unpack('<i',raw)[0]
              data=b''
              while len(data)<length:
                  chunk=sock.recv(length-len(data))
                  if not chunk: raise RuntimeError('short RCON body')
                  data+=chunk
              req,typ=struct.unpack('<ii',data[:8])
              return req,typ,data[8:-2].decode(errors='replace')
          with socket.create_connection(('127.0.0.1',25575),timeout=10) as s:
              s.sendall(packet(41,3,'hometown-m6-smoke'))
              req,typ,text=recv_packet(s)
              if req==-1: raise SystemExit('RCON authentication failed')
              s.sendall(packet(42,2,command))
              req,typ,text=recv_packet(s)
              print(text)
          PY
          }

          before_recipes=$(grep -Ec 'Loaded [0-9]+ recipes' run/logs/latest.log 2>/dev/null || true)
          rcon reload
          reloaded=0
          for i in $(seq 1 90); do
            after_recipes=$(grep -Ec 'Loaded [0-9]+ recipes' run/logs/latest.log 2>/dev/null || true)
            if [ "$after_recipes" -gt "$before_recipes" ]; then
              reloaded=1
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then break; fi
            sleep 1
          done

          echo '===== dedicated server console ====='
          cat /tmp/hometown-server.log || true
          echo '===== latest.log ====='
          cat run/logs/latest.log 2>/dev/null || true

          if [ "$reloaded" -ne 1 ]; then
            echo 'Resource reload did not complete.' >&2
            kill -TERM "$gradle_pid" 2>/dev/null || true
            exit 1
          fi
          if grep -Eqi 'Failed to reload|Reload failed|Exception while loading|Attempted to load class .* for invalid dist DEDICATED_SERVER|NoClassDefFoundError: net/minecraft/client|ClassNotFoundException: net\.minecraft\.client' /tmp/hometown-server.log run/logs/latest.log 2>/dev/null; then
            echo 'Detected a resource-reload or client-class failure.' >&2
            kill -TERM "$gradle_pid" 2>/dev/null || true
            exit 1
          fi

          rcon stop || true
          stopped=0
          for i in $(seq 1 45); do
            if ! kill -0 "$gradle_pid" 2>/dev/null; then stopped=1; break; fi
            sleep 1
          done
          if [ "$stopped" -ne 1 ]; then
            echo 'Server did not stop after RCON stop.' >&2
            kill -TERM "$gradle_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$gradle_pid" || true
          echo 'Dedicated server reached ready state, completed /reload, and stopped through RCON without a client-class crash.'
