name: R2 M6 Status Refresh

on:
  push:
    branches: [r2-m6]
    paths: [.github/workflows/r2-m6-status-refresh.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-m6
          fetch-depth: 1
      - name: Prepend current M6 status and retire one-shot workflow
        shell: python
        env:
          STATUS_HEADER_B64: 
        run: |
          import base64, os
          from pathlib import Path
          p=Path('docs/implementation/HOMETOWN_IMPLEMENTATION_STATUS.md')
          old=p.read_text()
          marker='## Current authoritative checkpoint — 2026-09-12'
          if marker in old:
              raise SystemExit('Current checkpoint already present')
          if not old.startswith('# Hometown implementation status'):
              raise SystemExit('Unexpected status file header')
          historical=old[len('# Hometown implementation status'):].lstrip('\n')
          current=base64.b64decode(os.environ['STATUS_HEADER_B64']).decode('utf-8')
          p.write_text(current+historical)
          Path('.github/workflows/r2-m6-status-refresh.yml').unlink()
      - name: Commit refreshed status
        run: |
          git config user.name "GalmUI"
          git config user.email "ciphergalm0118@gmail.com"
          git add -A
          git commit -m "Refresh implementation status for R2 M6"
          git push origin HEAD:r2-m6
